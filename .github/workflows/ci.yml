name: CI

on:
  pull_request:
  push:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run core and CLI tests
        run: cargo test -p fua-core -p cli

      - name: Run plugin tests
        run: cargo test -p fua-plugin-tailwind -p fua-plugin-angular

  format-check:
    name: HTML format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref || 'master' }}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build --release -p cli

      - name: Verify HTML formatting
        env:
          GITHUB_BASE_REF: ${{ github.base_ref || 'master' }}
        run: ./target/release/fua-fua --check --changed --config .fua/config.json
