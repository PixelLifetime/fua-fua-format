name: Release

# Trigger by pushing a semver tag: git tag v0.2.0 && git push --tags
on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always
  # Version is derived from the git tag (strip leading 'v')
  VERSION: ${{ github.ref_name }}

jobs:
  # ──────────────────────────────────────────────
  # 1. Build native CLI binaries for all platforms
  # ──────────────────────────────────────────────
  build-native:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            npm_pkg: fua-fua-win32-x64
            binary: fua-fua.exe

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            npm_pkg: fua-fua-linux-x64
            binary: fua-fua

          - os: macos-13          # Intel runner
            target: x86_64-apple-darwin
            npm_pkg: fua-fua-darwin-x64
            binary: fua-fua

          - os: macos-latest      # Apple Silicon runner
            target: aarch64-apple-darwin
            npm_pkg: fua-fua-darwin-arm64
            binary: fua-fua

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build CLI binary
        run: cargo build --release --target ${{ matrix.target }} -p cli

      - name: Stage binary into platform package
        shell: bash
        run: |
          mkdir -p packages/${{ matrix.npm_pkg }}/bin
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} \
             packages/${{ matrix.npm_pkg }}/bin/

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.npm_pkg }}
          path: packages/${{ matrix.npm_pkg }}/bin/

  # ──────────────────────────────────────────────
  # 2. Build WASM plugins
  # ──────────────────────────────────────────────
  build-wasm:
    name: Build WASM plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Build fua-plugin-tailwind
        run: >
          cargo build -p fua-plugin-tailwind
          --target wasm32-wasip1
          --release

      - name: Build fua-plugin-angular
        run: >
          cargo build -p fua-plugin-angular
          --target wasm32-wasip1
          --release

      - name: Stage WASM into npm packages
        run: |
          mkdir -p packages/fua-plugin-tailwind/dist
          mkdir -p packages/fua-plugin-angular/dist
          cp target/wasm32-wasip1/release/fua_plugin_tailwind.wasm \
             packages/fua-plugin-tailwind/dist/
          cp target/wasm32-wasip1/release/fua_plugin_angular.wasm \
             packages/fua-plugin-angular/dist/

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-plugins
          path: |
            packages/fua-plugin-tailwind/dist/
            packages/fua-plugin-angular/dist/

  # ──────────────────────────────────────────────
  # 3. Publish everything to npm
  # ──────────────────────────────────────────────
  publish-npm:
    name: Publish npm packages
    runs-on: ubuntu-latest
    needs: [build-native, build-wasm]
    permissions:
      contents: read
      id-token: write   # for npm provenance

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # Restore all built artifacts
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Place native binaries
        shell: bash
        run: |
          for pkg in fua-fua-win32-x64 fua-fua-linux-x64 fua-fua-darwin-x64 fua-fua-darwin-arm64; do
            mkdir -p packages/$pkg/bin
            cp -r artifacts/$pkg/. packages/$pkg/bin/
          done

      - name: Place WASM plugins
        shell: bash
        run: |
          mkdir -p packages/fua-plugin-tailwind/dist
          mkdir -p packages/fua-plugin-angular/dist
          cp -r artifacts/wasm-plugins/packages/fua-plugin-tailwind/dist/. \
               packages/fua-plugin-tailwind/dist/
          cp -r artifacts/wasm-plugins/packages/fua-plugin-angular/dist/. \
               packages/fua-plugin-angular/dist/

      # Stamp the version from the git tag in every package.json
      - name: Stamp version ${{ env.VERSION }}
        shell: bash
        run: |
          VERSION_NUM="${VERSION#v}"
          for pkg in \
            fua-fua-win32-x64 \
            fua-fua-linux-x64 \
            fua-fua-darwin-x64 \
            fua-fua-darwin-arm64 \
            fua-fua \
            fua-plugin-tailwind \
            fua-plugin-angular
          do
            PKG_JSON="packages/$pkg/package.json"
            # Update "version" field
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('$PKG_JSON'));
              p.version = '$VERSION_NUM';
              // Also update optionalDependencies versions in fua-fua
              if (p.optionalDependencies) {
                Object.keys(p.optionalDependencies).forEach(k => {
                  p.optionalDependencies[k] = '$VERSION_NUM';
                });
              }
              fs.writeFileSync('$PKG_JSON', JSON.stringify(p, null, 2) + '\n');
            "
          done

      # Publish platform-specific packages first (fua-fua depends on them)
      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in \
            fua-fua-win32-x64 \
            fua-fua-linux-x64 \
            fua-fua-darwin-x64 \
            fua-fua-darwin-arm64
          do
            npm publish packages/$pkg --access public --provenance
          done

      - name: Publish WASM plugins
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish packages/fua-plugin-tailwind --access public --provenance
          npm publish packages/fua-plugin-angular  --access public --provenance

      - name: Publish core fua-fua
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish packages/fua-fua --access public --provenance

  # ──────────────────────────────────────────────
  # 4. Create GitHub Release with binary downloads
  # ──────────────────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-native, build-wasm]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package binaries as tarballs
        run: |
          cd artifacts
          for pkg in fua-fua-win32-x64 fua-fua-linux-x64 fua-fua-darwin-x64 fua-fua-darwin-arm64; do
            tar czf ${pkg}.tar.gz $pkg
          done
          cp wasm-plugins/packages/fua-plugin-tailwind/dist/fua_plugin_tailwind.wasm .
          cp wasm-plugins/packages/fua-plugin-angular/dist/fua_plugin_angular.wasm   .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/fua-fua-win32-x64.tar.gz
            artifacts/fua-fua-linux-x64.tar.gz
            artifacts/fua-fua-darwin-x64.tar.gz
            artifacts/fua-fua-darwin-arm64.tar.gz
            artifacts/fua_plugin_tailwind.wasm
            artifacts/fua_plugin_angular.wasm
